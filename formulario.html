<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Alunos</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <header>
      <nav
        class="navbar navbar-expand-lg custom-navbar"
        data-bs-theme="dark"
        aria-label="Navegação principal"
      >
        <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="#"
            ><i class="bi bi-mortarboard-fill me-2" aria-hidden="true"></i
            >Claretiano Web</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Alternar navegação"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#">Início</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Cursos</a></li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#"
                  >Inscrição</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Contatos</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <h1 class="text-center">Cadastro de Alunos</h1>
      <p class="formato1 text-center">
        Preencha o formulário abaixo para cadastrar um novo aluno
      </p>
    </header>
    <main class="container">
      <!-- novalidate: desliga a validação nativa do navegador; quem valida agora é o nosso JS -->
      <form name="formulario" id="formAluno" action="#" method="post" novalidate>
        <div id="mensagemAlerta"></div>
        <fieldset>
          <legend>Dados Pessoais</legend>
          <div class="mb-3">
            <label for="ra" class="form-label">RA:</label>
            <input type="text" class="form-control" id="ra" name="ra" />
          </div>
          <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome" />
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha:</label>
            <input
              type="password"
              class="form-control"
              id="senha"
              name="senha"
            />
            <div class="progress mt-2" style="height: 6px">
              <div
                id="forcaSenha"
                class="progress-bar"
                role="progressbar"
                style="width: 0%"
              ></div>
            </div>
            <small id="textoForca" class="text-muted"></small>
            <div class="form-check mt-2">
              <input type="checkbox" class="form-check-input" id="verSenha" />
              <label class="form-check-label" for="verSenha"
                >Mostrar senha</label
              >
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" name="email" />
          </div>
        </fieldset>

        <fieldset>
          <legend>Opções Acadêmicas</legend>
          <div class="mb-3">
            <label for="curso" class="form-label">Curso:</label>
            <select name="curso" id="curso" class="form-select">
              <option value="">--Selecione--</option>
              <option value="ADS">Análise e Desenvolvimento de Sistemas</option>
              <option value="SI">Sistemas de Informação</option>
            </select>
          </div>
          <fieldset class="border-0 p-0 mb-3">
            <legend id="legendaTurno" class="fs-6 mb-2">Turno:</legend>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="turno"
                id="manha"
                value="manha"
                checked
              />
              <label class="form-check-label" for="manha">Matutino</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                class="form-check-input"
                type="radio"
                name="turno"
                id="noite"
                value="noite"
              />
              <label class="form-check-label" for="noite">Noturno</label>
            </div>
          </fieldset>

          <div class="mb-3 form-check">
            <input
              type="checkbox"
              name="notificacoes"
              id="notificacoes"
              class="form-check-input"
            />
            <label class="form-check-label" for="notificacoes"
              >Desejo receber notificações</label
            >
          </div>
        </fieldset>
        <button type="submit" class="btn btn-roxo">
          <i class="bi bi-send me-1"></i>Enviar
        </button>
        <button type="reset" class="btn btn-secondary">
          <i class="bi bi-eraser me-1"></i>Limpar
        </button>
      </form>
    </main>

    <footer class="rodape text-center text-light py-4 mt-5">
      <div class="container">
        <p class="mb-1">
          <i class="bi bi-mortarboard-fill me-2"></i>Claretiano WEB
        </p>
        <p class="mb-0">
          Dúvidas? Acesse o
          <a href="http://claretiano.edu.br" target="_blank">Portal do Aluno</a>
        </p>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
